name: Keep Supabase Alive

# Supabase pauses free-tier projects after 7 consecutive days with no database
# activity. A fortnightly ping is NOT enough — one missed run and the project
# pauses. This runs daily so we get ~7 chances before the deadline.
#
# NOTE: GitHub disables scheduled workflows in repositories with no activity for
# 60 days. The `keep-scheduler-alive` job below pushes an empty commit on the 1st
# of each month to reset that clock. Delete that job if you push regularly.

on:
  schedule:
    - cron: '17 8 * * *'   # daily, 08:17 UTC (off-the-hour to avoid GH congestion)
  workflow_dispatch:

concurrency:
  group: keep-alive
  cancel-in-progress: false

permissions:
  contents: write   # needed only by keep-scheduler-alive
  issues: write     # needed only to raise an alert on failure

jobs:
  ping:
    name: Ping Supabase
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify secrets are present
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          missing=0
          [ -z "$SUPABASE_URL" ]      && { echo "::error::SUPABASE_URL secret is not set";      missing=1; }
          [ -z "$SUPABASE_ANON_KEY" ] && { echo "::error::SUPABASE_ANON_KEY secret is not set"; missing=1; }
          exit $missing

      - name: Ping REST + run a real query
        id: ping
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -uo pipefail

          # Strip any trailing slash so we never build a "//rest/v1" URL.
          base="${SUPABASE_URL%/}"

          # Hitting /rest/v1/ only wakes PostgREST — it does not touch Postgres.
          # Selecting a real row issues an actual SQL statement, which is what
          # Supabase's inactivity detector measures.
          probe() {
            curl -sS --max-time 20 \
              -o /tmp/body.txt -w '%{http_code}' \
              "$base/rest/v1/businesses?select=id&limit=1" \
              -H "apikey: $SUPABASE_ANON_KEY" \
              -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
              -H "Accept: application/json"
          }

          code=""
          for attempt in 1 2 3 4 5; do
            code="$(probe || echo 000)"
            echo "Attempt $attempt -> HTTP $code"
            if [ "$code" = "200" ]; then
              echo "Supabase project is alive (query returned $(wc -c < /tmp/body.txt) bytes)"
              echo "status=$code" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            # A paused project answers 503/540; a cold start can take ~30s.
            sleep $((attempt * 15))
          done

          echo "status=$code" >> "$GITHUB_OUTPUT"
          echo "::error::Supabase ping failed after 5 attempts (last HTTP $code)"
          echo "--- response body ---"
          head -c 2000 /tmp/body.txt || true
          exit 1

      - name: Open an issue if the project looks paused
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'Supabase keep-alive failed';
            const { data: existing } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'keep-alive',
            });
            const body = [
              `The daily Supabase keep-alive ping failed.`,
              ``,
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              ``,
              `If the project is paused, restore it from the Supabase dashboard,`,
              `then re-run this workflow to confirm.`,
            ].join('\n');

            if (existing.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing[0].number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['keep-alive'],
              });
            }

  keep-scheduler-alive:
    name: Keep GitHub scheduler alive
    needs: ping
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check day of month
        id: day
        run: echo "dom=$(date -u +%d)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: steps.day.outputs.dom == '01'

      - name: Push an empty commit to reset the 60-day inactivity timer
        if: steps.day.outputs.dom == '01'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "chore: keep-alive heartbeat [skip ci]"
          git push
