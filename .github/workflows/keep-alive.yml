name: Keep Supabase Alive
on:
  schedule:
    # Runs every 2 weeks (1st and 15th of each month at 8:00 UTC)
    - cron: '0 8 1,15 * *'
  workflow_dispatch: # Allow manual trigger
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Check secrets are set
        run: |
          if [ -z "${{ secrets.SUPABASE_URL }}" ]; then
            echo "::error::SUPABASE_URL secret is missing or empty"
            exit 1
          fi
          if [ -z "${{ secrets.SUPABASE_ANON_KEY }}" ]; then
            echo "::error::SUPABASE_ANON_KEY secret is missing or empty"
            exit 1
          fi
          echo "Secrets are present, proceeding to ping."

      - name: Ping Supabase
        run: |
          response=$(curl -s -o /tmp/body.txt -w "%{http_code}" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}")

          echo "Response code: $response"
          echo "Response body:"
          cat /tmp/body.txt

          if [ "$response" -ne 200 ]; then
            echo "::error::Ping failed with status $response (see body above)"
            exit 1
          fi

          echo "Supabase project is alive"
