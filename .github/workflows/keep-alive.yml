name: Keep Supabase Alive
on:
  schedule:
    # Runs every 3 days so the Supabase free project does not pause for inactivity.
    - cron: '0 8 */3 * *'
  workflow_dispatch: # Allow manual trigger
jobs:
  ping:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
    steps:
      - name: Check secrets are set
        run: |
          if [ -z "$SUPABASE_URL" ]; then
            echo "::error::SUPABASE_URL secret is missing or empty"
            exit 1
          fi
          if [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::SUPABASE_ANON_KEY secret is missing or empty"
            exit 1
          fi
          echo "Secrets are present, proceeding to ping."

      - name: Ping Supabase
        run: |
          supabase_url="${SUPABASE_URL%/}"

          for attempt in 1 2 3 4 5; do
            response=$(curl --silent --show-error --location \
              --connect-timeout 15 \
              --max-time 45 \
              --output /tmp/body.txt \
              --write-out "%{http_code}" \
              "$supabase_url/rest/v1/" \
              -H "apikey: $SUPABASE_ANON_KEY" \
              -H "Authorization: Bearer $SUPABASE_ANON_KEY")

            echo "Attempt $attempt response code: $response"

            if [ "$response" -ge 200 ] && [ "$response" -lt 400 ]; then
              echo "Supabase project is alive"
              exit 0
            fi

            echo "Response body:"
            cat /tmp/body.txt

            if [ "$attempt" -lt 5 ]; then
              echo "Ping failed; waiting before retrying in case the project is waking up."
              sleep 30
            fi
          done

          echo "::error::Ping failed after 5 attempts"
          exit 1
