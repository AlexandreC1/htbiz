name: CI

on:
  push:
    branches: [main, 'feat/**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter:
    name: Analyze & test the app
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.35.4'
          channel: stable
          cache: true

      # .env is gitignored, so a checkout has no asset at the path pubspec
      # declares. Without this the build fails before analysis even starts.
      - name: Create a placeholder .env
        run: cp .env.example .env

      - run: flutter pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed lib test tool

      - name: Analyze
        run: flutter analyze

      - run: flutter test

      - name: Build release web app
        run: flutter build web --release

  database:
    name: Replay migrations & assert security invariants
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Replays every migration from an empty database, applies the hardening
      # migration twice to prove idempotency, then asserts that each fixed
      # vulnerability stays fixed.
      - name: Run the database test suite
        run: bash supabase/tests/run.sh

  edge-functions:
    name: Type-check edge functions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: denoland/setup-deno@4606d5cc6fb3f673efd4f594850e3f4b3e9d29cd # v2.0.0
        with:
          deno-version: v1.45.x

      - name: Check
        run: |
          for fn in supabase/functions/*/index.ts; do
            echo "==> $fn"
            deno check --no-lock "$fn"
          done
